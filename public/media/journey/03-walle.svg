<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160" width="240" height="160" fill="none">
  <rect width="240" height="160" rx="12" fill="#09090B"/>
  <rect width="238" height="158" x="1" y="1" rx="11" stroke="#26262B" stroke-width="1.5"/>
  
  <!-- Radar Cones Background -->
  <path d="M120 120 L50 30 A90 90 0 0 1 190 30 Z" fill="#B9A7FF" fill-opacity="0.08"/>
  <path d="M120 120 L75 55 A60 60 0 0 1 165 55 Z" fill="#B9A7FF" fill-opacity="0.12"/>
  <circle cx="120" cy="120" r="75" stroke="#B9A7FF" stroke-width="1" stroke-dasharray="3 3" opacity="0.3"/>
  <circle cx="120" cy="120" r="45" stroke="#B9A7FF" stroke-width="1" stroke-dasharray="3 3" opacity="0.4"/>
  
  <!-- Target Lock Box -->
  <rect x="145" y="32" width="56" height="20" rx="3" fill="#18181D" stroke="#FFD84D" stroke-width="1.2"/>
  <text x="173" y="45" fill="#FFD84D" font-family="monospace" font-size="7.5" font-weight="bold" text-anchor="middle">LOCK: 18.4cm</text>
  
  <!-- Robot Chassis Silhouette -->
  <!-- Wheels -->
  <rect x="68" y="105" width="14" height="32" rx="4" fill="#18181D" stroke="#3F3F46" stroke-width="1.5"/>
  <rect x="158" y="105" width="14" height="32" rx="4" fill="#18181D" stroke="#3F3F46" stroke-width="1.5"/>
  
  <!-- Main Chassis Base Plate -->
  <rect x="80" y="95" width="80" height="36" rx="6" fill="#16161A" stroke="#2D2D35" stroke-width="1.5"/>
  
  <!-- Arduino Board on top -->
  <rect x="94" y="90" width="52" height="18" rx="2" fill="#00878F" opacity="0.85"/>
  <text x="120" y="102" fill="#FFFFFF" font-family="monospace" font-size="6.5" font-weight="bold" text-anchor="middle">ATmega328P</text>
  
  <!-- Ultrasonic Sensor Eyes (HC-SR04) -->
  <rect x="95" y="70" width="50" height="20" rx="4" fill="#1E1E24" stroke="#B9A7FF" stroke-width="1.5"/>
  <circle cx="107" cy="80" r="6.5" fill="#111114" stroke="#B9A7FF" stroke-width="1.5"/>
  <circle cx="133" cy="80" r="6.5" fill="#111114" stroke="#B9A7FF" stroke-width="1.5"/>
  <circle cx="107" cy="80" r="2.5" fill="#FF4FA3"/>
  <circle cx="133" cy="80" r="2.5" fill="#FF4FA3"/>
  
  <!-- Sonar Waves emitted -->
  <path d="M107 68 A8 8 0 0 1 133 68" stroke="#FF4FA3" stroke-width="1.5" fill="none"/>
  <path d="M101 62 A16 16 0 0 1 139 62" stroke="#FF4FA3" stroke-width="1.2" stroke-dasharray="2 2" fill="none"/>
  
  <!-- Chapter Badge Pill -->
  <rect x="12" y="8" width="94" height="16" rx="4" fill="#16161A" stroke="#2D2D35" stroke-width="1"/>
  <text x="59" y="19" fill="#B9A7FF" font-family="monospace" font-size="8.5" font-weight="bold" text-anchor="middle" letter-spacing="1">03 // WALL-E</text>
</svg>
