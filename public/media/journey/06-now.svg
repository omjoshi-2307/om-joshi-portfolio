<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160" width="240" height="160" fill="none">
  <rect width="240" height="160" rx="12" fill="#09090B"/>
  <rect width="238" height="158" x="1" y="1" rx="11" stroke="#26262B" stroke-width="1.5"/>
  
  <!-- Neural Network Connections -->
  <line x1="50" y1="60" x2="110" y2="45" stroke="#7657D9" stroke-width="1.5" opacity="0.6"/>
  <line x1="50" y1="100" x2="110" y2="45" stroke="#B9A7FF" stroke-width="1" opacity="0.4"/>
  <line x1="50" y1="60" x2="110" y2="105" stroke="#B9A7FF" stroke-width="1" opacity="0.4"/>
  <line x1="50" y1="100" x2="110" y2="105" stroke="#7657D9" stroke-width="1.5" opacity="0.6"/>
  <line x1="110" y1="45" x2="180" y2="75" stroke="#FF4FA3" stroke-width="2" opacity="0.8"/>
  <line x1="110" y1="105" x2="180" y2="75" stroke="#FF4FA3" stroke-width="2" opacity="0.8"/>
  
  <!-- Layer 1 Nodes -->
  <circle cx="50" cy="60" r="10" fill="#16161A" stroke="#7657D9" stroke-width="2"/>
  <circle cx="50" cy="60" r="4" fill="#7657D9"/>
  <circle cx="50" cy="100" r="10" fill="#16161A" stroke="#7657D9" stroke-width="2"/>
  <circle cx="50" cy="100" r="4" fill="#7657D9"/>
  
  <!-- Layer 2 Nodes (Hidden Processing) -->
  <circle cx="110" cy="45" r="12" fill="#16161A" stroke="#B9A7FF" stroke-width="2"/>
  <circle cx="110" cy="45" r="5" fill="#B9A7FF"/>
  <circle cx="110" cy="105" r="12" fill="#16161A" stroke="#B9A7FF" stroke-width="2"/>
  <circle cx="110" cy="105" r="5" fill="#B9A7FF"/>
  
  <!-- Layer 3 Output / Inference Node -->
  <circle cx="180" cy="75" r="16" fill="#16161A" stroke="#FF4FA3" stroke-width="2.5"/>
  <circle cx="180" cy="75" r="7" fill="#FF4FA3"/>
  <circle cx="180" cy="75" r="3" fill="#FFFFFF"/>
  
  <!-- Tech Labels -->
  <text x="180" y="105" fill="#FF4FA3" font-family="monospace" font-size="7" font-weight="bold" text-anchor="middle">INFERENCE</text>
  <text x="50" y="125" fill="#A1A1AA" font-family="monospace" font-size="6.5" text-anchor="middle">TENSOR</text>
  
  <!-- Chapter Badge Pill -->
  <rect x="12" y="8" width="75" height="16" rx="4" fill="#16161A" stroke="#2D2D35" stroke-width="1"/>
  <text x="49" y="19" fill="#B9A7FF" font-family="monospace" font-size="8.5" font-weight="bold" text-anchor="middle" letter-spacing="1">06 // NOW</text>
</svg>
