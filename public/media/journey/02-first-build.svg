<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160" width="240" height="160" fill="none">
  <rect width="240" height="160" rx="12" fill="#09090B"/>
  <rect width="238" height="158" x="1" y="1" rx="11" stroke="#26262B" stroke-width="1.5"/>
  
  <!-- Hardware Enclosure & Electronics Schematic -->
  <rect x="25" y="35" width="95" height="95" rx="6" fill="#16161A" stroke="#2D2D35" stroke-width="1.5"/>
  <text x="72" y="52" fill="#A1A1AA" font-family="monospace" font-size="7" text-anchor="middle">DISPOSAL UNIT</text>
  
  <!-- Internal Relay / Heat Actuation Unit -->
  <rect x="40" y="62" width="65" height="36" rx="4" fill="#111114" stroke="#FF4FA3" stroke-width="1.5"/>
  <circle cx="55" cy="80" r="6" fill="#FF4FA3" fill-opacity="0.2"/>
  <path d="M52 80 L58 80 M55 77 L55 83" stroke="#FF4FA3" stroke-width="1.5"/>
  <text x="82" y="83" fill="#FF4FA3" font-family="monospace" font-size="8" font-weight="bold">RELAY</text>
  
  <rect x="35" y="105" width="75" height="14" rx="2" fill="#18181D"/>
  <text x="72" y="115" fill="#FFD84D" font-family="monospace" font-size="6.5" font-weight="bold" text-anchor="middle">STATUS: AUTOMATED</text>
  
  <!-- Microcontroller Board (Arduino UNO) -->
  <rect x="135" y="45" width="80" height="75" rx="4" fill="#00878F" opacity="0.9"/>
  <text x="175" y="62" fill="#FFFFFF" font-family="monospace" font-size="8" font-weight="bold" text-anchor="middle">Arduino UNO</text>
  <rect x="145" y="70" width="30" height="30" rx="2" fill="#111114"/>
  <text x="160" y="88" fill="#FFD84D" font-family="monospace" font-size="6" text-anchor="middle">ATmega</text>
  
  <!-- Connecting Jumper Wires -->
  <path d="M120 80 Q128 70 135 80" stroke="#FF4FA3" stroke-width="1.5" fill="none"/>
  <path d="M120 90 Q128 98 135 90" stroke="#B9A7FF" stroke-width="1.5" fill="none"/>
  
  <!-- Chapter Badge Pill -->
  <rect x="12" y="8" width="112" height="16" rx="4" fill="#16161A" stroke="#2D2D35" stroke-width="1"/>
  <text x="68" y="19" fill="#FF4FA3" font-family="monospace" font-size="8" font-weight="bold" text-anchor="middle" letter-spacing="1">02 // FIRST BUILD</text>
</svg>
