  <!-- Head -->
  <rect x="94" y="44" width="52" height="58" rx="16" fill="#F4F1EA"/>
  
  <!-- Hair -->
  <path d="M88 56 C88 34, 110 28, 120 28 C135 28, 154 36, 154 56 C150 48, 142 46, 134 46 C124 46, 116 42, 106 44 C96 46, 90 52, 88 56 Z" fill="#09090B"/>
  
