  <circle cx="132" cy="67" r="2.5" fill="#FF4FA3"/>
  <circle cx="109" cy="66" r="0.8" fill="#FFFFFF"/>
  <circle cx="133" cy="66" r="0.8" fill="#FFFFFF"/>
  
  <!-- Chapter Badge Pill -->
  <rect x="12" y="12" width="68" height="18" rx="4" fill="#16161A" stroke="#2D2D35" stroke-width="1"/>
  <text x="46" y="24" fill="#FF4FA3" font-family="monospace" font-size="9" font-weight="bold" text-anchor="middle" letter-spacing="1">01 // OM</text>
  
