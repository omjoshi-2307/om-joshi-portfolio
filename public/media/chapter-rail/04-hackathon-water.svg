<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160" width="240" height="160" fill="none">
  <rect width="240" height="160" rx="12" fill="#09090B"/>
  <rect width="238" height="158" x="1" y="1" rx="11" stroke="#26262B" stroke-width="1.5"/>
  
  <!-- Flow Mesh Waves -->
  <path d="M20 120 Q60 100 100 120 T180 120 T220 120" stroke="#7657D9" stroke-width="2" fill="none" opacity="0.6"/>
  <path d="M20 130 Q60 110 100 130 T180 130 T220 130" stroke="#B9A7FF" stroke-width="1.5" fill="none" opacity="0.4"/>
  <path d="M20 140 Q60 125 100 140 T180 140 T220 140" stroke="#7657D9" stroke-width="1" fill="none" opacity="0.2"/>
  
  <!-- Circular Reservoir Gauge -->
  <circle cx="85" cy="80" r="36" fill="#111114" stroke="#2D2D35" stroke-width="2"/>
  <circle cx="85" cy="80" r="30" stroke="#7657D9" stroke-width="4" stroke-dasharray="140 200" stroke-linecap="round"/>
  <text x="85" y="78" fill="#F4F1EA" font-family="monospace" font-size="14" font-weight="900" text-anchor="middle">84%</text>
  <text x="85" y="90" fill="#B9A7FF" font-family="monospace" font-size="6.5" text-anchor="middle">RESERVOIR</text>
  
  <!-- Digital Telemetry Block -->
  <rect x="135" y="48" width="85" height="30" rx="4" fill="#16161A" stroke="#2D2D35" stroke-width="1.2"/>
  <text x="142" y="60" fill="#7657D9" font-family="monospace" font-size="6.5" font-weight="bold">FLOW TELEMETRY</text>
  <text x="142" y="72" fill="#FF4FA3" font-family="monospace" font-size="9" font-weight="bold">12.4 L/min</text>
  
  <rect x="135" y="84" width="85" height="30" rx="4" fill="#16161A" stroke="#2D2D35" stroke-width="1.2"/>
  <text x="142" y="96" fill="#B9A7FF" font-family="monospace" font-size="6.5" font-weight="bold">PRESSURE SPRINT</text>
  <text x="142" y="108" fill="#FFD84D" font-family="monospace" font-size="8.5" font-weight="bold">2.8 BAR // OK</text>
  
  <!-- Chapter Badge Pill -->
  <rect x="12" y="8" width="105" height="16" rx="4" fill="#16161A" stroke="#2D2D35" stroke-width="1"/>
  <text x="64" y="19" fill="#7657D9" font-family="monospace" font-size="8.5" font-weight="bold" text-anchor="middle" letter-spacing="1">04 // HACKATHON</text>
</svg>
