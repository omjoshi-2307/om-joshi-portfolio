<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160" width="240" height="160" fill="none">
  <rect width="240" height="160" rx="12" fill="#09090B"/>
  <rect width="238" height="158" x="1" y="1" rx="11" stroke="#26262B" stroke-width="1.5"/>
  
  <!-- Blockchain Network Connection Matrix -->
  <line x1="45" y1="80" x2="110" y2="80" stroke="#FF4FA3" stroke-width="2" stroke-dasharray="4 3"/>
  <line x1="130" y1="80" x2="195" y2="80" stroke="#B9A7FF" stroke-width="2" stroke-dasharray="4 3"/>
  
  <!-- Left Party Node (Tenant) -->
  <rect x="20" y="60" width="48" height="40" rx="6" fill="#16161A" stroke="#2D2D35" stroke-width="1.5"/>
  <text x="44" y="76" fill="#A1A1AA" font-family="monospace" font-size="6.5" text-anchor="middle">TENANT</text>
  <text x="44" y="90" fill="#FF4FA3" font-family="monospace" font-size="7.5" font-weight="bold" text-anchor="middle">DEPOSIT</text>
  
  <!-- Central Smart Contract Escrow Vault -->
  <rect x="95" y="45" width="50" height="70" rx="8" fill="#16161A" stroke="#FF4FA3" stroke-width="2"/>
  <circle cx="120" cy="70" r="14" fill="#FF4FA3" fill-opacity="0.15"/>
  <!-- Lock Symbol -->
  <rect x="113" y="70" width="14" height="11" rx="2" fill="#FF4FA3"/>
  <path d="M116 70 V65 A4 4 0 0 1 124 65 V70" stroke="#FF4FA3" stroke-width="2" fill="none"/>
  
  <text x="120" y="95" fill="#FFFFFF" font-family="monospace" font-size="7" font-weight="900" text-anchor="middle">2,500</text>
  <text x="120" y="104" fill="#FF4FA3" font-family="monospace" font-size="6.5" font-weight="bold" text-anchor="middle">XLM</text>
  
  <!-- Right Party Node (Landlord) -->
  <rect x="172" y="60" width="48" height="40" rx="6" fill="#16161A" stroke="#2D2D35" stroke-width="1.5"/>
  <text x="196" y="76" fill="#A1A1AA" font-family="monospace" font-size="6.5" text-anchor="middle">LANDLORD</text>
  <text x="196" y="90" fill="#B9A7FF" font-family="monospace" font-size="7.5" font-weight="bold" text-anchor="middle">RELEASE</text>
  
  <!-- Bottom Protocol Specs -->
  <rect x="65" y="128" width="110" height="18" rx="3" fill="#111114" stroke="#2D2D35" stroke-width="1"/>
  <text x="120" y="140" fill="#E4E4E7" font-family="monospace" font-size="7.5" text-anchor="middle">SOROBAN // STELLAR</text>
  
  <!-- Chapter Badge Pill -->
  <rect x="12" y="8" width="90" height="16" rx="4" fill="#16161A" stroke="#2D2D35" stroke-width="1"/>
  <text x="57" y="19" fill="#FF4FA3" font-family="monospace" font-size="8.5" font-weight="bold" text-anchor="middle" letter-spacing="1">05 // SURED</text>
</svg>
